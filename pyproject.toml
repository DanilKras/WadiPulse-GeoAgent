[project]
name = "wadipulse-geoagent"
version = "0.1.0"
description = "Few-shot Geospatial Foundation Model (Prithvi-EO-2.0) and LLM Agent for Arid Irrigated Agriculture Monitoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.3",
    "einops>=0.8.2",
    "fastapi>=0.115.6",
    "folium>=0.19.4",
    "geopandas>=1.0.1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "mlflow>=2.19.0",
    "numpy>=1.26.4,<2.2",
    "openai>=1.58.1",
    "opencv-python-headless>=4.10.0.84",
    "pandas>=2.2.3",
    "pillow>=11.0.0",
    "planetary-computer>=1.0.0",
    "plotly>=5.24.1",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.7.0",
    "pyproj>=3.7.0",
    "pystac-client>=0.8.5",
    "rasterio>=1.4.3",
    "scikit-image>=0.25.0",
    "scikit-learn>=1.6.0",
    "scipy>=1.14.1",
    "shapely>=2.0.6",
    "streamlit>=1.41.1",
    "streamlit-folium>=0.24.0",
    "timm>=1.0.12",
    "torch>=2.5.1",
    "transformers>=4.47.1",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wadipulse"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

